name: NextSafar CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============ Job 1: Install Dependencies ============
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Generate Prisma Client
        run: cd packages/db && pnpm exec prisma generate

  # ============ Job 2: Build API ============
  build:
    name: 🔨 Build API
    runs-on: ubuntu-latest
    needs: install
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nextsafar
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nextsafar_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Generate Prisma Client
        run: cd packages/db && pnpm exec prisma generate
      
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://nextsafar:password@localhost:5432/nextsafar_core
        run: cd packages/db && pnpm exec prisma migrate deploy
      
      - name: Build API
        env:
          DATABASE_URL: postgresql://nextsafar:password@localhost:5432/nextsafar_core
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret
        run: cd apps/api && pnpm build

  # ============ Job 3: Build Admin ============
  build-admin:
    name: 🎨 Build Admin Panel
    runs-on: ubuntu-latest
    needs: install
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build Admin
        run: cd apps/admin && pnpm build
        continue-on-error: true

  # ============ Job 4: Docker Build ============
  docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [build, build-admin]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: nextsafar-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true
